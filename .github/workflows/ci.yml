name: Offline validation

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      EMBEDDING_PROVIDER: hashing
      LLM_PROVIDER: extractive
      CHUNKING_STRATEGY: sections
      DATA_DIR: work/ci-index
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint and dependency consistency
        run: |
          python -m ruff check app scripts tests
          python -m pip check
      - name: Unit and contract tests
        run: python -m pytest --junitxml=work/ci/junit.xml
      - name: Record resolved dependencies
        run: python -m pip freeze --all > work/ci/dependencies.txt
      - name: Smoke evaluation and development annotation checks
        run: |
          python -m scripts.evaluate --demo --output-dir work/ci --report-name smoke
          python -m scripts.export_support_review --split development --validate-only
      - name: Real HTTP demo verification
        run: python -m scripts.verify_local --requests 12 --concurrency 3 --output work/ci/http.json
      - name: Offline development diagnostic workbench
        run: python -m scripts.diagnose_retrieval --output work/ci/retrieval-diagnostics.json
      - name: Paired context budget experiment
        run: python -m scripts.compare_context --strategies bm25 --budgets 1200 2400 --output work/ci/context-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}
          path: |
            work/ci/
            work/http-verification/**/server.log
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and wait for demo readiness
        run: docker compose up --build --wait --wait-timeout 60
      - name: Verify container HTTP behavior
        run: |
          docker compose exec -T rag python -m scripts.benchmark_http --requests 12 --concurrency 3 --output /data/container-http.json
          mkdir -p work/ci
          docker compose cp rag:/data/container-http.json work/ci/container-http.json
      - name: Capture container logs
        if: always()
        run: |
          mkdir -p work/ci
          docker compose logs --no-color > work/ci/container.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-validation
          path: work/ci/
          retention-days: 14
      - name: Stop ephemeral CI containers
        if: always()
        run: docker compose down --volumes
