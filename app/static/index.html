<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>开发者技术支持 · Knowledge RAG Lab</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#182e3b;background:#f2f5f7;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:#142f40;color:#fff;padding:28px max(24px,calc((100vw - 1220px)/2))}header small{color:#a6cbd6;letter-spacing:2px}h1{font-size:28px;margin:10px 0}header p{color:#c4d5dd;line-height:1.7;margin:0}main{max-width:1268px;margin:auto;padding:28px 24px}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:22px}.card{background:#fff;border:1px solid #dbe3e8;border-radius:12px;padding:24px;min-width:0}h2{font-size:18px;margin:0 0 18px}.row{display:flex;gap:14px}.field{flex:1}label{display:block;font-size:13px;color:#4a6371;margin-bottom:6px}select,textarea,button{font:inherit;border-radius:7px}select,textarea{border:1px solid #bcccd6;padding:10px;width:100%;background:#fff;color:inherit}textarea{resize:vertical;min-height:125px;margin-top:6px}button{border:0;background:#176a72;color:#fff;padding:11px 20px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.hint{font-size:13px;color:#596f7e;line-height:1.65}.status{display:inline-block;padding:5px 9px;background:#e6f1f2;color:#1b6169;border-radius:5px;font-size:13px;margin-bottom:14px}.answer{white-space:pre-wrap;line-height:1.9;overflow-wrap:anywhere}.evidence{border-top:1px solid #e1e8ec;margin-top:14px;padding-top:14px}.evidence:first-of-type{border-top:0;margin-top:0}.evidence p,pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 ui-monospace,Consolas,monospace;max-height:280px;overflow:auto;background:#f6f8fa;padding:12px;border-radius:6px}a{color:#176a72}details{margin-top:20px}summary{cursor:pointer;font-size:14px;color:#425d6b}#mode{margin:0 0 20px}#result{margin-top:22px}.metric{display:inline-block;margin:10px 18px 0 0;font-size:13px;color:#425d6b}footer{margin-top:20px;font-size:12px;color:#617784}@media(max-width:850px){.grid{grid-template-columns:1fr}.row{flex-wrap:wrap}header{padding:24px}h1{font-size:24px}}
</style>
<header><small>KNOWLEDGE RAG LAB</small><h1>开发者技术支持</h1><p>选定文档版本，查找问题依据。每条结论都能回到具体的官方文档片段。</p></header>
<main><p id="mode" class="hint">正在连接本地知识库…</p><div class="grid"><section class="card"><h2>描述你遇到的问题</h2><form id="form"><div class="row"><div class="field"><label for="product">产品</label><select id="product"></select></div><div class="field"><label for="version">文档版本</label><select id="version"></select></div><div class="field"><label for="top_k">证据数量</label><select id="top_k"><option>3</option><option selected>5</option><option>10</option></select></div></div><label for="question" style="margin-top:20px">问题与必要的环境信息</label><textarea id="question" required placeholder="例如：前端带 Cookie 跨域请求失败，CORS 的允许源应怎样设置？"></textarea><p class="hint">这里提供的是固定历史版本的文档快照。请按实际环境选择；未指定且存在多个版本时，会先请求澄清。</p><button id="submit">查找证据并回答</button></form><div id="result" hidden><span id="status" class="status"></span><div id="answer" class="answer"></div><p id="verification" class="hint"></p><div id="timing"></div></div></section><section class="card"><h2>引用与原文</h2><div id="citations" class="hint">提交问题后，在这里核对来源、章节与原文。</div></section></div><details id="traceBox" hidden><summary>查看本次召回和请求记录</summary><pre id="trace"></pre></details><footer>模型对引用的核验仍可能出错，请结合原文判断。本工具提供技术支持建议，不执行命令。<a href="/versions">版本故障实验室</a> · <a href="/docs">接口文档</a></footer></main>
<script>
const $=id=>document.getElementById(id);let catalog={};
function option(parent,value,label){const el=document.createElement('option');el.value=value;el.textContent=label;parent.append(el)}
function versions(){const box=$('version');box.replaceChildren();option(box,'','未指定（必要时澄清）');for(const version of catalog[$('product').value]||[])option(box,version,version)}
async function initialize(){try{const [health,res]=await Promise.all([fetch('/health').then(r=>r.json()),fetch('/api/v1/catalog').then(r=>r.json())]);catalog=res.products;for(const product of Object.keys(catalog))option($('product'),product,product);versions();$('mode').textContent=(health.llm_provider==='extractive'?'零密钥演示：只展示检索片段，不代表真实模型回答效果。':'已选择真实模型模式；实际可用性以请求结果为准。')+' 已导入 '+health.document_count+' 份文档。';if(!health.document_count)$('mode').textContent+=' 请先运行文档导入命令。'}catch{$('mode').textContent='无法连接服务，请确认本地服务已启动。'}}
$('product').addEventListener('change',versions);
$('form').addEventListener('submit',async event=>{event.preventDefault();$('submit').disabled=true;$('submit').textContent='正在检索与核验…';$('result').hidden=false;$('status').textContent='处理中';$('answer').textContent='';$('citations').replaceChildren();$('verification').textContent='';$('timing').replaceChildren();$('traceBox').hidden=true;try{const payload={question:$('question').value,top_k:Number($('top_k').value)};if($('product').value)payload.product=$('product').value;if($('version').value)payload.version=$('version').value;const res=await fetch('/api/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!res.ok)throw Error('请求失败（HTTP '+res.status+'）');const data=await res.json();const labels={answered:'已回答',evidence_only:'仅检索片段',needs_clarification:'需要补充信息',insufficient_evidence:'证据不足',error:'服务异常'};$('status').textContent=labels[data.status]||data.status;$('answer').textContent=data.answer;$('verification').textContent=data.verification==='model_checked_not_human_verified'?'引用原文已匹配，并经模型检查支持关系；未经人工核验。':data.verification==='extractive_only'?'当前片段由检索直接返回，未进行语义答案核验。':'';if(!data.citations.length)$('citations').textContent='本次没有可引用的答案证据。';for(const hit of data.citations){const item=document.createElement('div');item.className='evidence';const title=document.createElement('strong');title.textContent='['+hit.citation_id+'] '+(hit.metadata.title||hit.source);const meta=document.createElement('div');meta.className='hint';meta.textContent=[hit.metadata.version,hit.metadata.section,hit.metadata.page_number?'第 '+hit.metadata.page_number+' 页':null].filter(Boolean).join(' · ')+(hit.metadata.context_chunk_ids?' · 合并自 '+hit.metadata.context_chunk_ids.length+' 个原始分块':'');const quote=document.createElement('p');quote.textContent=hit.text;item.append(title,meta,quote);const url=hit.metadata.upstream_url;if(url){try{const target=new URL(url);if(target.protocol==='https:'&&target.hostname==='github.com'){const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='查看固定版本的上游文档';item.append(link)}}catch{}}$('citations').append(item)}for(const [key,label]of [['retrieval_ms','检索'],['generation_ms','回答与核验'],['total_ms','总计']]){const span=document.createElement('span');span.className='metric';span.textContent=label+' '+data.trace[key]+' ms';$('timing').append(span)}const usage=document.createElement('span');usage.className='metric';usage.textContent='上下文 '+data.trace.context_chars+' 字符 · 重复 '+data.trace.duplicate_chars+' 字符 · '+data.trace.context_policy;$('timing').append(usage);$('traceBox').hidden=false;$('trace').textContent=JSON.stringify({trace:data.trace,reason:data.reason,retrieval:data.retrieval,context:data.context},null,2)}catch(error){$('status').textContent='服务异常';$('answer').textContent=error.message}finally{$('submit').disabled=false;$('submit').textContent='查找证据并回答'}});initialize();
</script></html>
